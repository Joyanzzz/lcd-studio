name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Instalador Windows x64
    runs-on: windows-2022
    permissions:
      # Solo este job crea el borrador de la versión en GitHub.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con la versión de package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
        working-directory: src-tauri
      - run: npm run tauri:build
      - name: Sumas SHA-256
        shell: pwsh
        run: |
          # GitHub sustituye los espacios de los nombres de archivo por puntos al
          # subirlos: se renombra antes para que SHA256SUMS.txt use el nombre real.
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Rename-Item -NewName { $_.Name -replace ' ', '.' }
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f.Name }
          $lines | Set-Content -Encoding ascii "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"
          Get-Content "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"
      - name: Compilación web
        shell: pwsh
        run: |
          npm run build
          Compress-Archive -Path dist/* -DestinationPath "lcd-studio-web-${{ github.ref_name }}.zip"
          (Get-FileHash "lcd-studio-web-${{ github.ref_name }}.zip" -Algorithm SHA256).Hash.ToLower() + "  lcd-studio-web-${{ github.ref_name }}.zip" | Add-Content -Encoding ascii "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Etiquetas con guion (v1.1.0-beta.1) se publican como pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            lcd-studio-web-${{ github.ref_name }}.zip
