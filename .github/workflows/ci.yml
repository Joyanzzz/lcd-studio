name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, pruebas y compilación web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Tamaño de la compilación
        run: |
          du -sh dist
          find dist -type f -name '*.js' -o -name '*.css' | xargs -I{} sh -c 'echo "$(gzip -9c {} | wc -c) {}"' | sort -n
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node scripts/check-licenses.ts
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}-es --project=${{ matrix.project }}-en
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/

  arduino:
    name: Compilación real de bocetos Arduino
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Núcleo y bibliotecas (versiones fijadas)
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install "LiquidCrystal@1.0.7" "LiquidCrystal I2C@1.1.2" "Adafruit SSD1306@2.5.17" "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4" "U8g2@2.36.19"
      - run: ARDUINO_CLI=arduino-cli node scripts/arduino-check.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arduino-report
          path: build/arduino-report.json

  rust:
    name: Pruebas Rust (Tauri)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
        working-directory: src-tauri
      - name: Avisos de licencia de terceros al día
        run: node scripts/third-party-notices.ts --check
