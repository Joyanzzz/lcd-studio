[package]
name = "lcd-studio"
version = "1.0.0"
description = "Editor local de gráficos y animaciones para pantallas LCD y OLED"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "lcd_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
